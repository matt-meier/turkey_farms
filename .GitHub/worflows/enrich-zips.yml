name: Enrich ZIP Coordinates (US Census ZCTA)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Attach Census 2020 ZCTA centroids to data.json
        run: python scripts/enrich_zips.py

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No coordinate updates to commit."
          else
            git commit -m "Enrich data.json with Census 2020 ZCTA coordinates"
            git push
          fi
